[package]
name = "long-shot-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance native long screenshot (scrolling capture) for Linux Wayland"
authors = ["Your Name"]
license = "MIT"

[dependencies]
# Wayland protocol handling
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Layer shell for always-on-top overlay
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = [] }
# Note: Uses Wayland event queue directly, no calloop

# Shared memory for Wayland buffers
nix = { version = "0.29", features = ["mman", "fs"] }
tempfile = "3.14"

# Input handling via evdev
evdev = "0.12"

# OpenCV for image stitching
opencv = { version = "0.93", default-features = false, features = ["imgproc", "imgcodecs", "highgui"] }

# GUI framework
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["image"] }
image = "0.25"

# Concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Clipboard
arboard = { version = "3.4", features = ["wayland-data-control"] }

# Utilities
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
